name: Maven CI

on:
  push:
    branches:
      - master
      - dev
      - "feature/**"
  pull_request:
    branches:
      - master
      - dev

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compile
        run: mvn -B compile

      - name: Test
        run: mvn -B test

      - name: Package with JavaDoc
        run: mvn -B package
